name: Validate cantiques

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Valider les cantiques
        run: npm run validate
      - name: Vérifier le build
        run: npm run build
